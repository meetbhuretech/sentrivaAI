name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinelai
          POSTGRES_PASSWORD: sentinelai
          POSTGRES_DB: sentinelai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelai -d sentinelai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://sentinelai:sentinelai@localhost:5432/sentinelai
      DATABASE_URL_SYNC: postgresql://sentinelai:sentinelai@localhost:5432/sentinelai
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production
      SIMULATOR_INTERNAL_TOKEN: change-me-simulator-token
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMeAdmin123!
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENABLE_DETECTION_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: |
          python -m pip install -U pip
          pip install -e ../../packages/shared-contracts/python
          pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests
      - name: Migrate
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinelai
          POSTGRES_PASSWORD: sentinelai
          POSTGRES_DB: sentinelai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelai -d sentinelai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://sentinelai:sentinelai@localhost:5432/sentinelai
      DATABASE_URL_SYNC: postgresql://sentinelai:sentinelai@localhost:5432/sentinelai
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-not-for-production
      SIMULATOR_INTERNAL_TOKEN: change-me-simulator-token
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMeAdmin123!
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENABLE_DETECTION_SCHEDULER: "false"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install -U pip
          pip install -e ../../packages/shared-contracts/python
          pip install -r requirements.txt
          alembic upgrade head
      - name: Start API
        working-directory: apps/api
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
      - name: Install web + Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start web
        working-directory: apps/web
        run: |
          npm run build
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/login && break
            sleep 1
          done
      - name: E2E
        working-directory: apps/web
        run: npx playwright test
